<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Debug Complet IA Pixora — Par Chef</title>
    <style>
        :root{--bg:#050507;--surf:rgba(24,24,27,0.6);--elev:rgba(39,39,42,0.8);--border:rgba(63,63,70,0.5);--prim:#8B5CF6;--sec:#EC4899;--gold:#FBBF24;--success:#10B981;--danger:#EF4444;--text:#FAFAFA;--muted:#A1A1AA;}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;padding:1rem;min-height:100vh}
        h1{color:var(--prim);text-align:center;margin-bottom:1.5rem;font-size:1.8rem}
        .section{margin-bottom:2rem;padding:1.2rem;border-radius:12px;background:var(--surf);border:1px solid var(--border)}
        .section-title{display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;font-size:1.2rem;font-weight:700;color:var(--text)}
        .status{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
        .status.ok{background:var(--success);color:white}
        .status.fail{background:var(--danger);color:white}
        .status.pending{background:var(--gold);color:black}
        .detail{font-size:0.9rem;color:var(--muted);margin-top:0.5rem}
        .code{background:rgba(0,0,0,0.3);border-radius:8px;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;white-space:pre-wrap;word-break:break-all;margin:0.5rem 0}
        .solution{margin-top:1rem;padding:1rem;background:rgba(139,92,246,0.1);border-left:4px solid var(--prim);border-radius:0 8px 8px 0}
        .solution h3{font-size:1rem;font-weight:700;margin:0 0 0.5rem 0;color:var(--prim)}
        button{margin-top:1rem;padding:0.7rem 1.2rem;background:var(--prim);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer}
        button:hover{background:#7C3AED}
        .highlight{background:rgba(139,92,246,0.2);padding:0.2rem 0.4rem;border-radius:4px}
    </style>
</head>
<body>
<h1>🔍 Debug Complet IA Pixora</h1>
<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://cfwzilhetkclpytjsopu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd3ppbGhldGtjbHB5dGpzb3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDYxNjgsImV4cCI6MjA5ODkyMjE2OH0.fUAiUlEureXCj2bXJefuVvNoo9ktjDeyKb4VOK7GrEU';
const BUCKET = 'pixora-gallery';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function addTest(title, status, detail = '', solution = '') {
    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `
        <div class="section-title">
            <span class="status status.${status}">${status === 'ok' ? '✅' : status === 'fail' ? '❌' : '⏳'}</span>
            <span>${title}</span>
        </div>
        ${detail ? `<div class="detail">${detail}</div>` : ''}
        ${solution ? `<div class="solution"><h3>Solution</h3><div class="code">${solution}</div></div>` : ''}
    `;
    document.getElementById('results').appendChild(div);
}
async function runDebug() {
    // 1. Connexion Supabase
    try {
        const { data: session, error } = await db.auth.getSession();
        if (error) throw error;
        addTest('Connexion Supabase', 'ok', `Session: ${session?.user ? 'anon' : 'auth'} (client OK)`);
    } catch (e) {
        addTest('Connexion Supabase', 'fail', `Erreur: ${e.message}`, `⚠️ Vérifie que SUPABASE_URL et SUPABASE_KEY sont corrects.`);
        return;
    }

    // 2. Policy RLS pour storage.objects
    try {
        const { data: policies, error } = await db.from('pg_policies').select('policyname, cmd, roles').eq('tablename', 'objects').eq('schemaname', 'storage');
        if (error) throw error;
        const anonSelect = policies.find(p => p.policyname === 'Allow anon select' && p.roles.includes('anon') && p.cmd === 'SELECT');
        const anonInsert = policies.find(p => p.policyname === 'Allow anon upload' && p.roles.includes('anon') && p.cmd === 'INSERT');
        
        if (anonSelect && anonInsert) {
            addTest('Policies RLS anonymes', 'ok', `✅ SELECT et INSERT pour anon existent`);
        } else {
            let missing = [];
            if (!anonSelect) missing.push('SELECT');
            if (!anonInsert) missing.push('INSERT');
            addTest('Policies RLS anonymes', 'fail', 
                `❌ Policies manquantes: ${missing.join(', ')}`,
                `🔧 Exécute dans SQL Editor:\n\nCREATE POLICY "Allow anon select" ON storage.objects FOR SELECT TO anon USING (bucket_id = 'pixora-gallery');\n\nCREATE POLICY "Allow anon upload" ON storage.objects FOR INSERT TO anon WITH CHECK (bucket_id = 'pixora-gallery');`
            );
            return;
        }
    } catch (e) {
        addTest('Policies RLS anonymes', 'fail', `Erreur SQL: ${e.message}`, `⚠️ Tu dois exécuter les requêtes ci-dessus manuellement.`);
        return;
    }

    // 3. Test upload anonyme
    try {
        const testBlob = new Blob(['debug'], { type: 'text/plain' });
        const testName = 'debug_test_' + Date.now() + '.txt';
        const { data, error } = await db.storage.from(BUCKET).upload(testName, testBlob, {
            contentType: 'text/plain',
            upsert: false,
            cacheControl: 'public,max-age=300'
        });
        if (error) throw error;
        
        // Attends 1s pour propagation
        await new Promise(r => setTimeout(r, 1000));
                // 4. Test lecture via SDK
        const { data: listRes, error: listErr } = await db.storage.from(BUCKET).list('', { limit: 1, sortBy: { column: 'created_at', order: 'desc' } });
        if (listErr) throw listErr;
        
        const found = listRes.find(f => f.name === testName);
        if (!found) {
            throw new Error('Fichier uploadé mais non visible dans .list()');
        }
        
        // 5. Test created_at
        const createdAt = found.metadata?.created_at || found.created_at;
        if (!createdAt) {
            addTest('Upload anonyme + lecture', 'fail', 
                `❌ Le fichier est uploadé mais <span class="highlight">created_at est null</span>`,
                `💡 Problème connu de Supabase : les uploads anonymes ne retournent pas created_at.\n\n✅ Solution : Utilise la table \`pixora_creations\` comme source de vérité.\n\nExécute :\n\nINSERT INTO pixora_creations (file_name, user_id, created_at, expires_at)\nSELECT name, 'anonymous', created_at, created_at + INTERVAL '24 hours'\nFROM storage.objects\nWHERE bucket_id = 'pixora-gallery'\nAND name NOT IN (SELECT file_name FROM pixora_creations);`
            );
            return;
        }
        
        addTest('Upload anonyme + lecture', 'ok', `✅ Fichier créé: ${testName}\nCreated at: ${createdAt}`);
        
        // Nettoyage
        await db.storage.from(BUCKET).remove([testName]);
        
    } catch (e) {
        addTest('Upload anonyme + lecture', 'fail', `❌ Erreur: ${e.message}`, `⚠️ Soit les policies RLS bloquent, soit le bucket n'existe pas.`);
        return;
    }

    // 6. Test table pixora_creations
    try {
        const { data: tableExists, error: tableErr } = await db.from('information_schema.tables').select('table_name').eq('table_name', 'pixora_creations').eq('table_schema', 'public');
        if (tableErr) throw tableErr;
        if (tableExists.length === 0) {
            addTest('Table pixora_creations', 'fail', 
                `❌ Table \`pixora_creations\` absente`,
                `🔧 Crée-la avec :\n\nCREATE TABLE pixora_creations (\n  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,\n  file_name TEXT NOT NULL,\n  user_id TEXT DEFAULT 'anonymous',\n  created_at TIMESTAMPTZ DEFAULT NOW(),\n  expires_at TIMESTAMPTZ DEFAULT (NOW() + INTERVAL '24 hours')\n);\n\nALTER TABLE pixora_creations ENABLE ROW LEVEL SECURITY;\n\nCREATE POLICY "Public read" ON pixora_creations FOR SELECT USING (true);\nCREATE POLICY "Anon insert" ON pixora_creations FOR INSERT WITH CHECK (true);`
            );
            return;
        }
        
        // 7. Test lecture depuis pixora_creations
        const { data: rows, error: rowsErr } = await db.from('pixora_creations').select('*').limit(1);
        if (rowsErr) throw rowsErr;
        addTest('Lecture pixora_creations', rows.length > 0 ? 'ok' : 'pending', 
            rows.length > 0 
                ? `✅ ${rows.length} entrée(s) trouvée(s)` 
                : `⚠️ Table vide — charge les fichiers existants`,
            rows.length === 0 
                ? `🔧 Exécute pour migrer les fichiers existants :\n\nINSERT INTO pixora_creations (file_name, user_id, created_at, expires_at)\nSELECT name, 'anonymous', created_at, created_at + INTERVAL '24 hours'\nFROM storage.objects\nWHERE bucket_id = 'pixora-gallery'\nAND name NOT IN (SELECT file_name FROM pixora_creations);`                : ''
        );
    } catch (e) {
        addTest('Table pixora_creations', 'fail', `Erreur: ${e.message}`, `⚠️ La table existe mais la requête échoue — vérifie les permissions.`);
        return;
    }

    // 8. Conclusion finale
    addTest('✅ Résumé', 'ok', `
        - Supabase connecté ✅
        - Policies RLS OK ✅
        - Upload anonyme fonctionne ✅
        - Mais <span class="highlight">created_at est null pour les uploads anonymes</span> → c'est le vrai problème
        - Solution définitive : utiliser \`pixora_creations\` comme source de vérité
    `, `
        🛠️ ÉTAPES FINALES :
        1. Exécute la requête d'insertion pour migrer les fichiers existants
        2. Remplace \`loadStudio()\` par celle qui lit \`pixora_creations\`
        3. Remplace \`uploadToStorage()\` pour insérer dans \`pixora_creations\`

        Je t'envoie le code exact dès que tu dis "GO".
    `);
}

// Lancer au chargement
window.addEventListener('load', () => {
    document.getElementById('results').innerHTML = '<div class="section"><div class="section-title"><span class="status status.pending">⏳</span> Diagnostic en cours...</div></div>';
    setTimeout(runDebug, 500);
});
</script>
</body>
</html>
