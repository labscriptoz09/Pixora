<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuditBot - Iapixora</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            color: #6c8cff;
        }
        .card {
            background: #161c26;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a3440;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .ok { background: #1a6b3c; color: #7ddfa0; }
        .error { background: #6b1a1a; color: #ff7d7d; }
        .warning { background: #6b5a1a; color: #ffd97d; }
        .label {
            color: #8a9bb5;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            display: block;
        }
        .value {
            font-size: 15px;
            margin-top: 4px;
            word-break: break-word;
            padding: 8px 12px;
            background: #0f141c;
            border-radius: 8px;
            border-left: 3px solid #6c8cff;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            background: #2a3440;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .btn {
            background: #6c8cff;
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active { background: #4a6fd0; }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        #loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #2a3440;
            border-top: 4px solid #6c8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1e2836;
        }
        .result-item:last-child { border-bottom: none; }
        .url-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a3440;
            background: #0f141c;
            color: #e8edf5;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .url-input:focus {
            outline: none;
            border-color: #6c8cff;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #5a6a80;
            margin-top: 20px;
        }
        .inline-icon { font-size: 18px; margin-right: 6px; }
        .warning-text { color: #ffd97d; }
        .error-text { color: #ff7d7d; }
        .good-text { color: #7ddfa0; }
        .score-box {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        .score-item {
            text-align: center;
        }
        .score-number {
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🤖 AuditBot</h1>

    <div class="card">
        <label class="label" style="margin-top:0;">🌐 URL à analyser</label>
        <input type="url" id="targetUrl" class="url-input" value="https://iapixora.com" />
        <button class="btn" id="runBtn">🚀 Lancer l'audit</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color:#8a9bb5;">Analyse en cours... ⏳</div>
        <div style="font-size:13px;color:#5a6a80;margin-top:6px;">(peut prendre 15-20 secondes)</div>
    </div>

    <div id="results"></div>

    <div class="footer">
        AuditBot v2.0 • 100% côté client • Aucune donnée envoyée
    </div>
</div>

<script>
    (function() {
        const runBtn = document.getElementById('runBtn');
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        const urlInput = document.getElementById('targetUrl');

        function getStatus(status) {
            if (status === 'OK') return '<span class="status ok">✅ OK</span>';
            if (status === 'ERROR') return '<span class="status error">❌ Erreur</span>';
            if (status === 'WARNING') return '<span class="status warning">⚠️ Attention</span>';
            return '';
        }

        function createCard(title, content, status = 'OK') {
            return `
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <strong style="font-size:16px;">${title}</strong>
                        ${getStatus(status)}
                    </div>
                    <div class="value">${content || '—'}</div>
                </div>
            `;
        }

        async function fetchViaProxy(url) {
            // Méthode 1: Utiliser le proxy CORS Anywhere
            const proxyUrls = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest='
            ];

            for (const proxy of proxyUrls) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(url), {
                        timeout: 15000
                    });
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.length > 100) {
                            return text;
                        }
                    }
                } catch (e) {
                    console.log('Proxy failed:', proxy, e);
                }
            }
            throw new Error('Tous les proxies ont échoué. Vérifiez que le site est accessible.');
        }

        function analyzeHTML(htmlText, baseUrl) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // Extraire les données
            const title = doc.querySelector('title')?.textContent?.trim() || '';
            const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim() || '';
            const h1s = Array.from(doc.querySelectorAll('h1')).map(h => h.textContent.trim()).filter(Boolean);
            const h2s = Array.from(doc.querySelectorAll('h2')).map(h => h.textContent.trim()).filter(Boolean);
            const images = doc.querySelectorAll('img');
            const missingAlt = Array.from(images).filter(img => !img.getAttribute('alt') || img.getAttribute('alt') === '').length;

            // Liens internes
            const domain = new URL(baseUrl).hostname;
            const allLinks = Array.from(doc.querySelectorAll('a[href]'));
            const internalLinks = allLinks
                .map(a => a.getAttribute('href'))
                .filter(href => {
                    if (!href || href.startsWith('#') || href.startsWith('javascript:')) return false;
                    try {
                        const full = new URL(href, baseUrl).href;
                        return full.includes(domain) && full !== baseUrl;
                    } catch { return false; }
                })
                .filter((v, i, a) => a.indexOf(v) === i)
                .slice(0, 50);

            // Mots-clés (contenu)
            const bodyText = doc.body?.textContent || '';
            const words = bodyText.toLowerCase().split(/\s+/).filter(w => w.length > 4 && !/^\d+$/.test(w));
            const freq = {};
            words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
            const keywords = sorted.slice(0, 10).map(([k]) => k);

            const wordCount = words.length;

            // Balises meta robots
            const robots = doc.querySelector('meta[name="robots"]')?.getAttribute('content') || '';

            return {
                title,
                description: metaDesc,
                h1s,
                h2s,
                images: images.length,
                missing_alt: missingAlt,
                internal_links: internalLinks,
                keywords,
                word_count: wordCount,
                robots,
                links_total: allLinks.length
            };
        }

        function displayResults(data, url) {
            // Score global
            let score = 0;
            let total = 0;

            const checks = [
                { name: 'Title', pass: data.title.length >= 30 && data.title.length <= 60 },
                { name: 'Meta Description', pass: data.description.length >= 120 && data.description.length <= 160 },
                { name: 'Balises H1', pass: data.h1s.length === 1 },
                { name: 'Images avec alt', pass: data.missing_alt === 0 },
                { name: 'Nombre de mots', pass: data.word_count >= 300 },
                { name: 'Liens internes', pass: data.internal_links.length > 0 }
            ];

            checks.forEach(c => {
                total++;
                if (c.pass) score++;
            });

            const scorePercent = Math.round((score / total) * 100);
            const scoreColor = scorePercent >= 80 ? 'good-text' : (scorePercent >= 50 ? 'warning-text' : 'error-text');

            let html = `
                <div class="card" style="background:#1a2430;border-color:#2a3a4a;text-align:center;margin-bottom:16px;">
                    <div style="font-size:14px;color:#8a9bb5;">📋 Analyse terminée pour</div>
                    <div style="font-size:18px;font-weight:600;color:#6c8cff;word-break:break-all;">${url}</div>
                    <div class="score-box">
                        <div class="score-item">
                            <div class="score-number ${scoreColor}">${scorePercent}%</div>
                            <div style="font-size:12px;color:#8a9bb5;">Score SEO</div>
                        </div>
                        <div class="score-item">
                            <div class="score-number">${data.word_count}</div>
                            <div style="font-size:12px;color:#8a9bb5;">Mots</div>
                        </div>
                        <div class="score-item">
                            <div class="score-number">${data.internal_links.length}</div>
                            <div style="font-size:12px;color:#8a9bb5;">Liens internes</div>
                        </div>
                    </div>
                </div>
            `;

            // === TITLE ===
            const titleOk = data.title.length >= 30 && data.title.length <= 60;
            html += createCard(
                '📌 Balise Title',
                `${data.title || 'Manquant'} <span class="badge">${data.title.length} caractères</span>`,
                titleOk ? 'OK' : 'WARNING'
            );

            // === META DESCRIPTION ===
            const descOk = data.description.length >= 120 && data.description.length <= 160;
            html += createCard(
                '📝 Meta Description',
                `${data.description || 'Manquante'} <span class="badge">${data.description.length} caractères</span>`,
                descOk ? 'OK' : 'WARNING'
            );

            // === H1 ===
            const h1Ok = data.h1s.length === 1;
            html += createCard(
                '📰 Balises H1',
                `${data.h1s.length > 0 ? data.h1s.join(' | ') : 'Aucune balise H1 trouvée'} <span class="badge">${data.h1s.length} trouvée(s)</span>`,
                h1Ok ? 'OK' : 'WARNING'
            );

            // === H2 ===
            html += createCard(
                '📑 Balises H2',
                data.h2s.length > 0 ? data.h2s.slice(0, 5).join(' | ') + (data.h2s.length > 5 ? ` ... (+${data.h2s.length - 5})` : '') : 'Aucune balise H2',
                data.h2s.length > 0 ? 'OK' : 'WARNING'
            );

            // === IMAGES ===
            const imgOk = data.missing_alt === 0;
            html += createCard(
                '🖼️ Images',
                `${data.images} images · ${data.missing_alt} sans attribut "alt"`,
                imgOk ? 'OK' : 'WARNING'
            );

            // === NOMBRE DE MOTS ===
            const wordOk = data.word_count >= 300;
            html += createCard(
                '📊 Nombre de mots',
                `${data.word_count} mots`,
                wordOk ? 'OK' : 'WARNING'
            );

            // === LIENS INTERNES ===
            const links = data.internal_links || [];
            const linksDisplay = links.length > 0
                ? links.slice(0, 8).map(l => `<div style="font-size:13px;color:#8a9bb5;padding:2px 0;word-break:break-all;">→ ${l}</div>`).join('') + (links.length > 8 ? `<div style="font-size:13px;color:#5a6a80;margin-top:4px;">... et ${links.length - 8} autres</div>` : '')
                : 'Aucun lien interne trouvé';
            html += createCard(
                '🔗 Liens internes',
                linksDisplay + `<div style="font-size:13px;color:#5a6a80;margin-top:6px;">Total : ${links.length} liens</div>`,
                links.length > 0 ? 'OK' : 'WARNING'
            );

            // === MOTS-CLÉS ===
            html += createCard(
                '🏷️ Mots-clés principaux',
                data.keywords.length > 0 ? data.keywords.slice(0, 8).map(k => `<span style="background:#1e2836;padding:2px 8px;border-radius:12px;margin:2px;display:inline-block;">${k}</span>`).join(' ') : 'Aucun mot-clé détecté',
                data.keywords.length > 0 ? 'OK' : 'WARNING'
            );

            // === ROBOTS ===
            html += createCard(
                '🤖 Meta Robots',
                data.robots || 'Non spécifié (index, follow par défaut)',
                data.robots.includes('noindex') ? 'WARNING' : 'OK'
            );

            resultsDiv.innerHTML = html;
        }

        async function runAudit() {
            let url = urlInput.value.trim();
            if (!url) {
                alert('Veuillez entrer une URL valide.');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            runBtn.disabled = true;
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const htmlText = await fetchViaProxy(url);
                const data = analyzeHTML(htmlText, url);
                displayResults(data, url);
            } catch (err) {
                resultsDiv.innerHTML = `
                    <div class="card" style="border-color:#6b1a1a;">
                        <div style="color:#ff7d7d;font-weight:600;">❌ Erreur</div>
                        <div style="margin-top:8px;color:#8a9bb5;">${err.message}</div>
                        <div style="margin-top:12px;font-size:13px;color:#5a6a80;">
                            💡 Vérifiez que le site est accessible et que l'URL est correcte.
                        </div>
                        <div style="margin-top:8px;font-size:13px;color:#5a6a80;">
                            🔧 Essayez avec : <strong>https://iapixora.com</strong>
                        </div>
                    </div>
                `;
            } finally {
                runBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        runBtn.addEventListener('click', runAudit);
        window.addEventListener('load', runAudit);
    })();
</script>
</body>
</html>
