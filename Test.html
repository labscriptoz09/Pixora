<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Qualité - Config Ancienne</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:sans-serif;text-align:center}
img{max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
button{background:#8B5CF6;color:#fff;border:none;padding:.8rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;margin:.5rem}
button:hover{background:#7C3AED}
.status{color:#A1A1AA;margin:1rem 0}
textarea{width:100%;max-width:600px;min-height:80px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:1rem;color:#fff;font-family:inherit;font-size:.95rem;resize:none;outline:none;margin-bottom:1rem}
textarea:focus{border-color:#8B5CF6}
</style>
</head>
<body>
<h1>🧪 Test — Config Ancienne (Qualité PRO)</h1>
<p class="status">fal.ai: 512×512 + upscale:true | Pollinations: 1024×1024 + model=flux</p>

<textarea id="prompt" placeholder="Décris ton image...">Portrait of a young woman with freckles and curly red hair, golden hour sunlight, cinematic lighting, masterpiece, best quality, ultra detailed, 8k</textarea>

<button onclick="testPoll()">Test Pollinations (model=flux)</button>
<button onclick="testHF()">Test Hugging Face FLUX</button>

<div id="result"></div>

<script>
const SUFFIX = ', masterpiece, best quality, ultra detailed, 8k, cinematic lighting';

// Test 1: Pollinations avec model=flux (config qui donnait les images ID 19/20)
function testPoll() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const seed = Math.floor(Math.random() * 100000);
  const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt + SUFFIX) + '?width=1024&height=1024&nologo=true&seed=' + seed + '&model=flux';

  document.getElementById('result').innerHTML = '<p class="status">⏳ Pollinations model=flux...</p>';

  const img = new Image();
  img.onload = function() {
    document.getElementById('result').innerHTML = '';
    document.getElementById('result').appendChild(img);
    const info = document.createElement('p');
    info.className = 'status';
    info.textContent = '✅ Pollinations model=flux — 1024×1024 — Seed: ' + seed;
    document.getElementById('result').appendChild(info);
  };
  img.onerror = function() {
    document.getElementById('result').innerHTML = '<p style="color:#EF4444">❌ Échec Pollinations</p>';
  };
  img.src = url;
}

// Test 2: Hugging Face FLUX.1-dev (gratuit, sans clé pour les modèles publics)
async function testHF() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;

  document.getElementById('result').innerHTML = '<p class="status">⏳ Hugging Face FLUX.1-dev...</p>';

  try {
    const res = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        inputs: prompt + SUFFIX,
        parameters: { width: 1024, height: 1024, num_inference_steps: 28 }
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status + ' — Modèle peut nécessiter un token HF gratuit');

    const blob = await res.blob();
    const imgUrl = URL.createObjectURL(blob);

    const img = new Image();
    img.src = imgUrl;
    img.style.maxWidth = '100%';
    img.style.borderRadius = '12px';

    document.getElementById('result').innerHTML = '';
    document.getElementById('result').appendChild(img);
    const info = document.createElement('p');
    info.className = 'status';
    info.textContent = '✅ Hugging Face FLUX.1-dev — 1024×1024';
    document.getElementById('result').appendChild(info);

  } catch (err) {
    document.getElementById('result').innerHTML = '<p style="color:#EF4444">❌ HF: ' + err.message + '<br><small>Ajoute un token gratuit sur huggingface.co/settings/tokens si besoin</small></p>';
  }
}
</script>
</body>
</html>
