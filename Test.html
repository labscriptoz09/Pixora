<!DOCTYPE html>
<html>
<body>
<h2>Test fal.ai — Ancienne config (qualité PRO)</h2>
<p>→ width:512, height:512, upscale:true</p>
<button onclick="generate()">Générer</button>
<div id="result"></div>

<script>
async function generate() {
  const prompt = "Portrait of a young woman with freckles and curly red hair, golden hour sunlight, cinematic lighting, masterpiece";
  const url = 'https://queue.fal.run/fal-ai/flux/schnell';
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': 'Key ta_cle_ici', // ← mets ta vraie clé fal.ai
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      prompt: prompt,
      width: 512,
      height: 512,
      num_images: 1,
      upscale: true
    })
  });
  const data = await res.json();
  const img = new Image();
  img.src = data.images[0].url;
  img.style.maxWidth = '100%';
  document.getElementById('result').innerHTML = '';
  document.getElementById('result').appendChild(img);
}
</script>
</body>
</html>
