<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Ancienne Config - IA Pixora</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:sans-serif;text-align:center}
img{max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
button{background:#8B5CF6;color:#fff;border:none;padding:.8rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;margin:.5rem}
button:hover{background:#7C3AED}
.status{color:#A1A1AA;margin:1rem 0}
textarea{width:100%;max-width:600px;min-height:80px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:1rem;color:#fff;font-family:inherit;font-size:.95rem;resize:none;outline:none;margin-bottom:1rem}
textarea:focus{border-color:#8B5CF6}
</style>
</head>
<body>
<h1>🧪 Test ANCIENNE Config</h1>
<p class="status">Config originale : 512×512 • Sans upscale • Sans steps • Sans model=flux</p>

<textarea id="prompt" placeholder="Décris ton image...">Portrait of a young woman with freckles and curly red hair, golden hour sunlight, cinematic lighting, masterpiece, best quality, ultra detailed, 8k</textarea>

<button onclick="testPollinations()">Test Pollinations (512×512)</button>
<button onclick="testFalAI()">Test fal.ai (512×512)</button>

<div id="result"></div>

<script>
// EXACTEMENT comme dans l'ancien index.html
function getPollinationsUrlOld(prompt) {
    var seed = Math.floor(Math.random() * 100000);
    var url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&nologo=true&seed=' + seed;
    return url;
}

// Test Pollinations avec l'ancienne config
function testPollinations() {
    var prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { alert('Entre un prompt !'); return; }

    var url = getPollinationsUrlOld(prompt);
    var resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<p class="status">⏳ Pollinations 512×512 (ancienne config)...</p>';

    var img = new Image();
    img.onload = function() {
        resultDiv.innerHTML = '';
        resultDiv.appendChild(img);
        var info = document.createElement('p');
        info.className = 'status';        info.textContent = '✅ Pollinations — 512×512 — Seed: ' + url.split('seed=')[1];
        resultDiv.appendChild(info);
    };
    img.onerror = function() {
        resultDiv.innerHTML = '<p style="color:#EF4444">❌ Échec Pollinations</p>';
    };
    img.src = url;
}

// Test fal.ai avec l'ancienne config (EXACTEMENT comme dans l'ancien code)
async function testFalAI() {
    var prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { alert('Entre un prompt !'); return; }

    // NOTE: fal.ai nécessite une clé API. Si tu n'en as pas, ce test échouera.
    // L'ancien code utilisait fal.ai AVEC une clé stockée dans Supabase admin_config
    var FAL_KEY = ''; // ← Mets ta clé fal.ai ici si tu l'as

    if (!FAL_KEY) {
        document.getElementById('result').innerHTML = '<p style="color:#FBBF24">⚠️ Clé fal.ai requise. Vérifie dans Supabase → admin_config → api_keys<br><small>L\'ancien code chargeait la clé depuis Supabase automatiquement</small></p>';
        return;
    }

    var resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<p class="status">⏳ fal.ai 512×512 (ancienne config)...</p>';

    try {
        // EXACTEMENT comme dans l'ancien buildBody de fal.ai
        var res = await fetch('https://queue.fal.run/fal-ai/flux/schnell', {
            method: 'POST',
            headers: {
                'Authorization': 'Key ' + FAL_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                prompt: prompt,
                width: 512,
                height: 512,
                num_images: 1
                // PAS de upscale, PAS de steps, PAS de guidance_scale
            })
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        var data = await res.json();
        var url = null;
        if (data.images && data.images[0] && data.images[0].url) {
            url = data.images[0].url;
        } else if (data.output && data.output.images && data.output.images[0] && data.output.images[0].url) {            url = data.output.images[0].url;
        }

        if (!url) throw new Error('URL non trouvée dans la réponse');

        var img = new Image();
        img.onload = function() {
            resultDiv.innerHTML = '';
            resultDiv.appendChild(img);
            var info = document.createElement('p');
            info.className = 'status';
            info.textContent = '✅ fal.ai flux/schnell — 512×512 — Sans upscale/steps';
            resultDiv.appendChild(info);
        };
        img.src = url;

    } catch (err) {
        resultDiv.innerHTML = '<p style="color:#EF4444">❌ fal.ai Error: ' + err.message + '</p>';
    }
}
</script>
</body>
</html>
