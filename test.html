<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test OVHcloud AI Endpoints - Debug 401</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:'Inter',sans-serif}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;margin-bottom:.5rem}
.subtitle{text-align:center;color:#A1A1AA;margin-bottom:1.5rem;font-size:.9rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:#FAFAFA}
input[type="text"],textarea{width:100%;padding:.9rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none}
textarea{min-height:80px;resize:vertical}
.btn-gen{width:100%;padding:1rem;background:linear-gradient(135deg,#0066FF,#00A3FF);color:#fff;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result{margin-top:1.5rem;text-align:center}
.result img{max-width:100%;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.status{padding:1rem;border-radius:10px;margin-top:1rem;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.8rem;word-break:break-all}
.status.loading{background:rgba(0,102,255,.1);color:#00A3FF}
.status.success{background:rgba(16,185,129,.1);color:#10B981}
.status.error{background:rgba(239,68,68,.1);color:#EF4444}
</style>
</head>
<body>
<div class="container">
<h1>🔧 Test OVHcloud (Debug 401)</h1>
<p class="subtitle">Tente les 2 formats d'API OVH pour trouver le bon</p>

<div class="form-group">
<label>Prompt</label>
<textarea id="prompt">A beautiful portrait of a young woman with curly red hair, golden hour lighting, cinematic, masterpiece</textarea>
</div>

<button class="btn-gen" id="btn" onclick="generate()">🚀 Tester les 2 endpoints</button>
<div id="status"></div>
<div class="result" id="result"></div>
</div>

<script>
// Ton token (vérifie qu'il n'y a pas d'espace avant ou après)
const API_KEY = 'eyJhbGciOiJFZERTQSIsImtpZCI6IjgzMkFGNUE5ODg3MzFCMDNGM0EzMTRFMDJFRUJFRjBGNDE5MUY0Q0YiLCJraW5kIjoicGF0IiwidHlwIjoiSldUIn0.eyJ0b2tlbiI6Im1QenRqTkxlMlY2SVpyMWRrbkV2R1RXaEhmaXFxNFdnN3FuYnBuRUNVSUE9In0.t6eESdVYmFD3mXwwUUetJJXlhL1BxEWijT4wkK8xbURgYXrcCZsvComY3xaNT_BBNDwptHYgL4wHrIwsEP0QBQ';

const BASE_URL = 'https://oai.endpoints.kepler.ai.cloud.ovh.net';

async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');  const resultEl = document.getElementById('result');

  btn.disabled = true;
  btn.textContent = '⏳ Test en cours...';
  resultEl.innerHTML = '';

  const payload = {
    model: "stabilityai/stable-diffusion-xl-base-1.0",
    prompt: prompt,
    negative_prompt: "ugly, blurry, low quality, distorted, watermark",
    width: 1024,
    height: 1024,
    num_inference_steps: 30,
    guidance_scale: 7.5
  };

  const headers = {
    'Authorization': `Bearer ${API_KEY.trim()}`,
    'Content-Type': 'application/json'
  };

  // On teste d'abord l'endpoint natif OVH, puis le format OpenAI
  const endpointsToTry = [
    `${BASE_URL}/api/generate`,
    `${BASE_URL}/v1/images/generations`
  ];

  for (const url of endpointsToTry) {
    statusEl.className = 'status loading';
    statusEl.textContent = `🔄 Tentative sur : ${url}...`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        const data = await response.json();
        console.log('SUCCÈS:', data);
        
        // Extraire l'URL de l'image selon le format de réponse
        let imageUrl = null;
        if (data.images && data.images[0]) imageUrl = data.images[0].url || data.images[0];
        else if (data.data && data.data[0]) imageUrl = data.data[0].url;
        else if (data.output && data.output.images) imageUrl = data.output.images[0].url;

        if (imageUrl) {
          statusEl.className = 'status success';          statusEl.textContent = `✅ SUCCÈS sur : ${url}`;
          const img = document.createElement('img');
          img.src = imageUrl;
          img.onclick = () => window.open(imageUrl, '_blank');
          resultEl.appendChild(img);
          btn.disabled = false;
          btn.textContent = '🚀 Régénérer';
          return; // On arrête ici, ça a marché !
        }
      } else {
        const errorText = await response.text();
        console.warn(`Échec sur ${url}:`, response.status, errorText);
        if (response.status === 401) {
          statusEl.className = 'status error';
          statusEl.innerHTML = `❌ ERREUR 401 sur ${url}<br><br>Message du serveur :<br>${errorText}<br><br>👉 <strong>Action requise :</strong> Ton token est invalide ou expiré. Retourne dans la console OVHcloud et régénère un nouveau token pour ce modèle.`;
          btn.disabled = false;
          btn.textContent = '🚀 Réessayer';
          return; // On arronne car si c'est 401 sur le premier, ça le sera sur le second
        }
      }
    } catch (err) {
      console.error('Erreur réseau:', err);
    }
  }

  statusEl.className = 'status error';
  statusEl.textContent = '❌ Échec sur tous les endpoints. Vérifie la console (F12) pour les détails.';
  btn.disabled = false;
  btn.textContent = '🚀 Réessayer';
}
</script>
</body>
</html>
