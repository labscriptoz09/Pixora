<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Clé API Pollinations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f14;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #a855f7;
            text-align: center;
        }
        .subtitle { color: #a1a1aa; margin-bottom: 2rem; text-align: center; font-size: 0.9rem; }
        
        .card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0.5rem; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus, textarea:focus { border-color: #a855f7; }
        textarea { min-height: 80px; resize: vertical; }
        
        button {
            width: 100%;
            padding: 1rem;            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover:not(:disabled) { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .result-box {
            margin-top: 1.5rem;
            min-height: 300px;
            background: #09090b;
            border: 2px dashed #27272a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .result-box img { max-width: 100%; border-radius: 8px; }
        
        .logs {
            margin-top: 1.5rem;
            background: #000;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            max-height: 250px;
            overflow-y: auto;
            color: #22c55e;
        }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>    <div class="container">
        <h1>🧪 Test Clé API Pollinations</h1>
        <p class="subtitle">Endpoint: gen.pollinations.ai/v1/images/generations</p>

        <div class="card">
            <div class="form-group">
                <label>Clé API (Déjà remplie)</label>
                <input type="password" id="apiKey" value="sk_yaXQwD7tH1nP9k8zg1WRtc0McBvpJq02">
            </div>
            
            <div class="form-group">
                <label>Modèle</label>
                <select id="model">
                    <option value="flux">FLUX (Recommandé)</option>
                    <option value="flux-realism">FLUX Realism</option>
                    <option value="any-dark">Any Dark</option>
                </select>
            </div>

            <div class="form-group">
                <label>Prompt</label>
                <textarea id="prompt">Epic fantasy warrior in black armor with glowing blue runes, cinematic lighting, highly detailed, 8k resolution, masterpiece</textarea>
            </div>

            <button onclick="testAPI()" id="btnTest">🚀 Tester la génération</button>

            <div class="result-box" id="resultBox">
                <div id="loading" style="display:none; text-align:center;">
                    <div class="spinner" style="margin: 0 auto 1rem;"></div>
                    <p>Génération en cours...</p>
                </div>
                <p id="placeholder" style="color: #52525b;">L'image apparaîtra ici</p>
            </div>
        </div>

        <div class="card">
            <label style="margin-bottom: 0.5rem;">📋 Logs de la réponse (Pour le débogage)</label>
            <div class="logs" id="logs">En attente du test...</div>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = type === 'error' ? 'log-error' : 'log-info';
            div.textContent = `> ${msg}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }
        async function testAPI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('model').value;
            const prompt = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('btnTest');
            const loading = document.getElementById('loading');
            const placeholder = document.getElementById('placeholder');
            const resultBox = document.getElementById('resultBox');

            if (!apiKey || !prompt) {
                alert("Clé ou prompt manquant !");
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            placeholder.style.display = 'none';
            // Nettoyer les anciennes images
            const oldImg = resultBox.querySelector('img');
            if (oldImg) oldImg.remove();

            log(`Envoi de la requête au modèle: ${model}...`, 'info');

            try {
                const response = await fetch('https://gen.pollinations.ai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: prompt,
                        width: 1024,
                        height: 1024,
                        n: 1,
                        seed: Math.floor(Math.random() * 10000)
                    })
                });

                log(`Statut HTTP: ${response.status} ${response.statusText}`, response.ok ? 'info' : 'error');

                const data = await response.json();
                log(`Réponse brute: ${JSON.stringify(data).substring(0, 300)}...`, response.ok ? 'info' : 'error');

                if (!response.ok) {
                    throw new Error(data.error?.message || `Erreur API: ${response.status}`);
                }
                // Pollinations retourne généralement un tableau "data" avec des objets "url"
                const imageUrl = data.data?.[0]?.url || data.url;

                if (imageUrl) {
                    log('✅ Succès ! URL de l\'image récupérée.', 'info');
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "Generated Image";
                    img.onload = () => log('✅ Image chargée et affichée avec succès.', 'info');
                    img.onerror = () => {
                        log('❌ L\'URL est valide mais l\'image refuse de se charger (CORS ou lien mort).', 'error');
                    };
                    resultBox.appendChild(img);
                } else {
                    throw new Error("Aucune URL d'image trouvée dans la réponse JSON.");
                }

            } catch (error) {
                log(`❌ ÉCHEC: ${error.message}`, 'error');
                placeholder.style.display = 'block';
                placeholder.textContent = `Erreur: ${error.message}`;
                placeholder.style.color = '#ef4444';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
