<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Hugging Face FLUX.1-dev</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:sans-serif;text-align:center}
img{max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
button{background:#8B5CF6;color:#fff;border:none;padding:.8rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;margin:.5rem}
button:hover{background:#7C3AED}
button:disabled{opacity:.5;cursor:not-allowed}
.status{color:#A1A1AA;margin:1rem 0}
textarea,input{width:100%;max-width:600px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:1rem;color:#fff;font-family:inherit;font-size:.95rem;outline:none;margin-bottom:1rem;display:block;margin-left:auto;margin-right:auto}
textarea{min-height:80px;resize:none}
textarea:focus,input:focus{border-color:#8B5CF6}
.timer{font-family:monospace;color:#FBBF24;font-size:.9rem}
</style>
</head>
<body>
<h1>🤗 Test Hugging Face FLUX.1-dev</h1>
<p class="status">Token gratuit → huggingface.co/settings/tokens</p>

<input type="text" id="token" placeholder="Colle ton token HF ici (hf_...)">

<textarea id="prompt" placeholder="Décris ton image...">Portrait of a young woman with freckles and curly red hair, golden hour sunlight, cinematic lighting, masterpiece, best quality, ultra detailed, 8k</textarea>

<button id="btn" onclick="generate()">Générer avec HF FLUX.1-dev</button>
<p class="timer" id="timer"></p>

<div id="result"></div>

<script>
async function generate() {
  var token = document.getElementById('token').value.trim();
  var prompt = document.getElementById('prompt').value.trim();
  var resultDiv = document.getElementById('result');
  var btn = document.getElementById('btn');
  var timerEl = document.getElementById('timer');

  if (!token) {
    resultDiv.innerHTML = '<p style="color:#EF4444">❌ Colle ton token HF !<br><small>Crée-le gratuitement sur huggingface.co/settings/tokens</small></p>';
    return;
  }
  if (!prompt) {
    resultDiv.innerHTML = '<p style="color:#EF4444">❌ Entre un prompt !</p>';
    return;
  }

  btn.disabled = true;  btn.textContent = '⏳ Génération...';
  resultDiv.innerHTML = '<p class="status">⏳ Envoi à Hugging Face...</p>';

  var start = Date.now();
  var timerInterval = setInterval(function() {
    var elapsed = ((Date.now() - start) / 1000).toFixed(1);
    timerEl.textContent = 'Temps écoulé : ' + elapsed + 's';
  }, 100);

  try {
    var res = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        inputs: prompt,
        parameters: {
          width: 1024,
          height: 1024,
          num_inference_steps: 28,
          guidance_scale: 3.5
        }
      })
    });

    clearInterval(timerInterval);

    if (!res.ok) {
      var errText = await res.text();
      throw new Error('HTTP ' + res.status + ' — ' + errText);
    }

    var blob = await res.blob();
    var imgUrl = URL.createObjectURL(blob);

    var img = new Image();
    img.onload = function() {
      var elapsed = ((Date.now() - start) / 1000).toFixed(1);
      resultDiv.innerHTML = '';
      resultDiv.appendChild(img);
      var info = document.createElement('p');
      info.className = 'status';
      info.textContent = '✅ HF FLUX.1-dev — 1024×1024 — ' + elapsed + 's';
      resultDiv.appendChild(info);
      btn.disabled = false;
      btn.textContent = 'Générer avec HF FLUX.1-dev';
      timerEl.textContent = '';
    };    img.onerror = function() {
      resultDiv.innerHTML = '<p style="color:#EF4444">❌ Impossible d\'afficher l\'image</p>';
      btn.disabled = false;
      btn.textContent = 'Générer avec HF FLUX.1-dev';
      timerEl.textContent = '';
    };
    img.src = imgUrl;

  } catch (err) {
    clearInterval(timerInterval);
    resultDiv.innerHTML = '<p style="color:#EF4444">❌ Erreur : ' + err.message + '</p>';
    btn.disabled = false;
    btn.textContent = 'Générer avec HF FLUX.1-dev';
    timerEl.textContent = '';
  }
}
</script>
</body>
</html>
