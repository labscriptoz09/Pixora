<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final Worker IA Pixora</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f14;
            color: #e4e4e7;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #a855f7; font-size: 1.5rem; text-align: center; }
        .worker-url { 
            background: #18181b; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            word-break: break-all; 
            text-align: center;
            margin-bottom: 20px;
            color: #a1a1aa;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #result {
            background: #18181b;
            border-radius: 12px;
            padding: 15px;
            min-height: 100px;
        }
        #result img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid #27272a;
        }
        .status { font-weight: bold; margin-bottom: 10px; }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .loading { color: #eab308; }
        
        details {
            margin-top: 15px;
            background: #000;
            border-radius: 8px;
            padding: 10px;
        }
        summary { cursor: pointer; color: #a1a1aa; font-size: 0.9rem; }
        pre { 
            font-size: 0.75rem; 
            color: #60a5fa; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🧪 Test Final Worker</h1>
    <div class="worker-url">ia-pixora-api.slimansoufian1.workers.dev</div>
    
    <textarea id="prompt" placeholder="Décris l'image à générer...">Epic fantasy warrior in black armor with glowing blue runes, 512x512</textarea>
    
    <button id="btnGenerate" onclick="genererImage()">🚀 Générer l'image</button>
    
    <div id="result">
        <p style="color: #52525b; text-align: center;">L'image ou le résultat apparaîtra ici</p>
    </div>

    <script>
        async function genererImage() {            const prompt = document.getElementById('prompt').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('btnGenerate');

            if (!prompt) {
                alert("Veuillez entrer un prompt !");
                return;
            }

            btn.disabled = true;
            btn.textContent = "⏳ Génération en cours...";
            resultDiv.innerHTML = '<p class="status loading">⏳ Envoi de la requête au Worker...</p>';

            try {
                const response = await fetch('https://ia-pixora-api.slimansoufian1.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        width: 512,
                        height: 512
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `Erreur HTTP ${response.status}`);
                }

                if (data.success && data.url) {
                    resultDiv.innerHTML = `
                        <p class="status success">✅ Succès ! Image générée.</p>
                        <p style="font-size: 0.9rem; color: #a1a1aa;">Taille: ${data.width}x${data.height}</p>
                        <img src="${data.url}" alt="Image générée par IA">
                        <br><br>
                        <a href="${data.url}" download="ia-pixora-test.jpg" style="color: #8b5cf6; font-weight: bold;">⬇️ Télécharger l'image</a>
                        
                        <details>
                            <summary>Voir la réponse JSON brute (Debug)</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    throw new Error("Le Worker n'a pas retourné d'URL d'image valide.");
                }

            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="status error">❌ Échec de la génération</p>                    <p style="color: #ef4444;">${error.message}</p>
                    <details>
                        <summary>Voir les détails de l'erreur</summary>
                        <pre>${error.stack || error.message}</pre>
                    </details>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 Générer l'image";
            }
        }
    </script>
</body>
</html>
