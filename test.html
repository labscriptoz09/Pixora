<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Test Final Génération IA</title>
<style>
  body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  h1 { color: #8B5CF6; margin-bottom: 10px; font-size: 1.4rem; }
  p { color: #A1A1AA; margin-bottom: 20px; font-size: 0.9rem; }
  .btn { background: linear-gradient(135deg, #8B5CF6, #EC4899); border: none; padding: 15px 30px; border-radius: 12px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin: 10px 0; }
  .btn:disabled { opacity: 0.5; }
  .result { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-top: 20px; text-align: left; font-size: 0.9rem; line-height: 1.5; word-break: break-all; display: none; }
  .ok { color: #10B981; }
  .fail { color: #EF4444; }
  .loading { color: #8B5CF6; }
  img { max-width: 100%; border-radius: 12px; margin-top: 15px; border: 2px solid #8B5CF6; box-shadow: 0 10px 30px rgba(139,92,246,0.3); }
</style>
</head>
<body>

  <h1>🚀 Test Final de Génération</h1>
  <p>Ce test utilise exactement le code corrigé de ton site.</p>
  
  <div id="status" class="result"></div>
  <div id="image-container"></div>

  <button class="btn" id="testBtn" onclick="runTest()">▶️ LANCER LE TEST</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cfwzilhetkclpytjsopu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd3ppbGhldGtjbHB5dGpzb3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDYxNjgsImV4cCI6MjA5ODkyMjE2OH0.fUAiUlEureXCj2bXJefuVvNoo9ktjDeyKb4VOK7GrEU';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function log(text, type='normal') {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.className = 'result ' + (type === 'ok' ? 'ok' : type === 'fail' ? 'fail' : 'loading');
      status.innerHTML += text + '<br><br>';
    }

    async function runTest() {
      const status = document.getElementById('status');
      const imgContainer = document.getElementById('image-container');
      const btn = document.getElementById('testBtn');
      
      status.style.display = 'block';
      status.className = 'result loading';
      status.innerHTML = '⏳ Vérification en cours...<br><br>';      imgContainer.innerHTML = '';
      btn.disabled = true;

      try {
        // 1. Vérifier la session
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
          log('❌ Tu n\'es pas connecté.', 'fail');
          log('💡 Va sur iapixora.com, connecte-toi, puis reviens sur cette page.', 'fail');
          btn.disabled = false;
          return;
        }
        log('✅ 1. Session valide détectée.', 'ok');

        // 2. Appel Edge Function (AVEC LE FIX apikey)
        log('⏳ 2. Envoi de la requête à l\'Edge Function...', 'loading');
        
        const response = await fetch(SUPABASE_URL + '/functions/v1/generate-image', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + session.access_token,
            'apikey': SUPABASE_KEY // ✅ LE FIX CRUCIAL
          },
          body: JSON.stringify({ 
            prompt: 'a beautiful glowing butterfly, photorealistic, 8k, highly detailed, cinematic lighting', 
            width: 768, 
            height: 768 
          })
        });

        log('📡 Réponse reçue : Status ' + response.status, response.ok ? 'ok' : 'fail');

        if (!response.ok) {
          const errorText = await response.text();
          log('❌ Erreur serveur : ' + errorText.substring(0, 200), 'fail');
          btn.disabled = false;
          return;
        }

        // 3. Parser le JSON
        const data = await response.json();
        log('✅ 3. JSON valide reçu de l\'Edge Function !', 'ok');
        
        if (data.url) {
          log('🖼️ 4. URL de l\'image générée :', 'ok');
          log(data.url, 'ok');
          
          // 5. Afficher l'image à l'écran
          log('⏳ 5. Chargement de l\'image à l\'écran...', 'loading');          const img = document.createElement('img');
          img.src = data.url;
          
          img.onload = function() {
            log('🎉 SUCCÈS TOTAL ! L\'image s\'affiche parfaitement.', 'ok');
            btn.disabled = false;
          };
          
          img.onerror = function() {
            log('❌ L\'URL est bonne, mais l\'image ne charge pas (Problème R2 ou CORS image).', 'fail');
            btn.disabled = false;
          };
          
          imgContainer.appendChild(img);
        } else {
          log('⚠️ Réponse OK, mais pas d\'URL d\'image dans le JSON.', 'fail');
          log(JSON.stringify(data), 'fail');
          btn.disabled = false;
        }

      } catch (error) {
        log('💥 ERREUR CRITIQUE : ' + error.message, 'fail');
        if (error.message.includes('Failed to fetch')) {
          log('🔍 Cela signifie que le navigateur bloque la requête (Cache, Adblocker, ou CORS mal déployé).', 'fail');
        }
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
