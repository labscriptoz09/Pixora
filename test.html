<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Lexica.art Feed — Prompts + Images</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:'Inter',sans-serif}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;margin-bottom:.5rem}
.subtitle{text-align:center;color:#A1A1AA;margin-bottom:1.5rem;font-size:.9rem}
.controls{display:flex;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;justify-content:center}
.controls input,.controls button{padding:.7rem 1.2rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:.9rem;cursor:pointer;outline:none;font-family:inherit}
.controls input:focus{border-color:#8B5CF6}
.controls button{background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;font-weight:700}
.controls button:hover{opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem}
.card{background:rgba(24,24,27,.6);border:1px solid rgba(63,63,70,.5);border-radius:16px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.card-body{padding:1rem}
.card-prompt{font-size:.82rem;color:#FAFAFA;line-height:1.5;margin-bottom:.8rem;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-size:.65rem;padding:.2rem .6rem;border-radius:6px;font-weight:600;font-family:'JetBrains Mono',monospace}
.tag-model{background:rgba(139,92,246,.2);color:#8B5CF6}
.tag-size{background:rgba(255,255,255,.08);color:#A1A1AA}
.status{text-align:center;color:#A1A1AA;padding:3rem;font-size:1rem}
.error{color:#EF4444}
.count{text-align:center;color:#71717A;font-size:.8rem;margin-top:1rem}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<h1>🔍 Test Lexica.art Feed</h1>
<p class="subtitle">Prompts réels + images de la communauté IA — API gratuite, sans clé</p>

<div class="controls">
<input type="text" id="query" placeholder="Ex: portrait, anime, cyberpunk" value="portrait">
<select id="limit">
<option value="20">20 images</option>
<option value="50">50 images</option>
</select>
<button onclick="loadFeed()">🚀 Charger</button>
</div>

<div id="status" class="status">Clique sur "Charger" pour tester</div>
<div class="grid" id="grid"></div>
<div class="count" id="count"></div>
</div>
<script>
async function loadFeed() {
  var q = document.getElementById('query').value.trim() || 'portrait';
  var limit = document.getElementById('limit').value;
  var btn = document.querySelector('.controls button');
  var statusEl = document.getElementById('status');
  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');

  if (!q) { statusEl.className='status error'; statusEl.textContent='❌ Entrez un mot-clé'; return; }

  btn.disabled = true;
  btn.textContent = '⏳ ...';
  statusEl.className = 'status';
  statusEl.textContent = 'Récupération depuis lexica.art...';
  grid.innerHTML = '';
  countEl.textContent = '';

  try {
    // ✅ Lexica.art API publique — fonctionne sans token
    var url = `https://lexica.art/api/v1/search?q=${encodeURIComponent(q)}&limit=${limit}`;
    var res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    var data = await res.json();
    if (!data || !data.images || data.images.length === 0) {
      throw new Error('Aucune image trouvée');
    }

    grid.innerHTML = '';
    data.images.forEach(function(item) {
      var prompt = item.prompt || 'Pas de prompt';
      var model = item.model || 'Inconnu';
      var width = item.width || '?';
      var height = item.height || '?';
      var imageUrl = item.src || '';

      if (!imageUrl) return;

      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        `<img src="${imageUrl}" alt="IA Art" loading="lazy" onclick="window.open('${imageUrl}','_blank')" style="cursor:pointer">` +
        `<div class="card-body">` +
          `<div class="card-prompt">${escapeHtml(prompt)}</div>` +
          `<div class="card-meta">` +
            `<span class="tag tag-model">🤖 ${escapeHtml(model)}</span>` +
            `<span class="tag tag-size">📐 ${width}×${height}</span>` +
          `</div>` +        `</div>`;
      grid.appendChild(card);
    });

    countEl.textContent = `✅ ${data.images.length} images chargées — Source: lexica.art`;
    statusEl.textContent = '';

  } catch(err) {
    statusEl.className = 'status error';
    statusEl.textContent = '❌ Erreur: ' + err.message;
    console.error('Lexica error:', err);
  }

  btn.disabled = false;
  btn.textContent = '🚀 Charger';
}

function escapeHtml(text) {
  return text.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, '&#039;');
}
</script>
</body>
</html>
