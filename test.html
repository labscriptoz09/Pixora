<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test JSON Worker</title>
    <style>
        body { background: #0f0f14; color: #fff; padding: 20px; font-family: Arial; }
        button { background: #8b5cf6; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; margin: 10px 0; }
        #output { background: #000; padding: 15px; border-radius: 8px; font-size: 12px; word-break: break-all; max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Test JSON Brut</h1>
    <button onclick="test()">Tester le Worker</button>
    <div id="output">Clique sur le bouton...</div>

    <script>
        async function test() {
            const output = document.getElementById('output');
            output.textContent = 'Chargement...';
            
            try {
                const response = await fetch('https://ia-pixora-api.slimansoufian1.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: 'A red apple on white background',
                        width: 512,
                        height: 512
                    })
                });

                const data = await response.json();
                
                // Afficher le JSON complet
                output.innerHTML = `
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Width:</strong> ${data.width}</p>
                    <p><strong>Height:</strong> ${data.height}</p>
                    <p><strong>URL commence par:</strong></p>
                    <p>${data.url ? data.url.substring(0, 100) : 'PAS D\'URL'}</p>
                    <hr>
                    <p><strong>JSON complet:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                output.textContent = 'Erreur: ' + error.message;
            }
        }
    </script>
</body>
</html>
