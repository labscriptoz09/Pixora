<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Mobile IA Pixora</title>
<style>
  body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; padding: 20px; text-align: center; }
  h1 { color: #8B5CF6; font-size: 1.5rem; }
  .btn { background: linear-gradient(135deg, #8B5CF6, #EC4899); border: none; padding: 15px 30px; border-radius: 12px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin: 20px 0; }
  .result { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-top: 15px; text-align: left; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #10B981; }
  .fail { color: #EF4444; }
  .warn { color: #F59E0B; }
</style>
</head>
<body>
  <h1>📱 Test Mobile IA Pixora</h1>
  <p style="color:#A1A1AA">Ce test affiche les résultats directement à l'écran.</p>
  
  <button class="btn" onclick="runTest()">▶️ LANCER LE TEST</button>
  
  <div id="output" class="result" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cfwzilhetkclpytjsopu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd3ppbGhldGtjbHB5dGpzb3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDYxNjgsImV4cCI6MjA5ODkyMjE2OH0.fUAiUlEureXCj2bXJefuVvNoo9ktjDeyKb4VOK7GrEU';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const out = document.getElementById('output');

    function log(text, type='normal') {
      out.style.display = 'block';
      const color = type === 'ok' ? 'ok' : type === 'fail' ? 'fail' : type === 'warn' ? 'warn' : '';
      out.innerHTML += `<div class="${color}">${text}</div><br>`;
    }

    async function runTest() {
      out.style.display = 'block';
      out.innerHTML = '⏳ Test en cours... patiente 10 secondes...<br><br>';
      
      // 1. Test Session
      const {data:{session}} = await db.auth.getSession();
      if(!session) {
        log('❌ Tu n\'es pas connecté sur ce site.', 'fail');
        log('💡 Va sur iapixora.com, connecte-toi, puis reviens sur cette page.', 'warn');
        return;
      }
      log('✅ 1. Tu es bien connecté.', 'ok');

      // 2. Test Edge Function
      log('⏳ 2. Test de la fonction de génération...');
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/generate-image', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + session.access_token,
            'apikey': SUPABASE_KEY
          },
          body: JSON.stringify({ prompt: 'test', width: 256, height: 256 })
        });
        
        const text = await res.text();
        if(res.ok) {
          log('✅ 2. Edge Function répond ! (Status 200)', 'ok');
          try {
            const json = JSON.parse(text);
            log('🖼️ URL de l\'image: ' + (json.url || 'Non fournie'), 'ok');
            
            // 3. Test si l'image est accessible
            log('⏳ 3. Test d\'accès à l\'image R2...');
            const imgRes = await fetch(json.url);
            if(imgRes.ok) {
              log('✅ 3. L\'image est accessible publiquement !', 'ok');
              log('🎉 TOUT FONCTIONNE. Le problème vient peut-être de l\'affichage sur la page principale.', 'ok');
            } else {
              log('❌ 3. L\'image est générée mais BLOQUÉE (Status: ' + imgRes.status + ')', 'fail');
              log('💡 Vérifie que ton bucket R2 est en "Public Access" sur Cloudflare.', 'warn');
            }
          } catch(e) {
            log('⚠️ Réponse inattendue: ' + text.substring(0, 100), 'warn');
          }
        } else {
          log('❌ 2. Erreur Edge Function (Status: ' + res.status + ')', 'fail');
          log('Détail: ' + text.substring(0, 150), 'fail');
        }
      } catch(e) {
        log('❌ 2. Erreur réseau (Failed to fetch)', 'fail');
        log('Détail: ' + e.message, 'fail');
        log('💡 Vérifie les logs de ta fonction sur le site Supabase.', 'warn');
      }
    }
  </script>
</body>
</html>
