<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Worker Cloudflare</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: #fff; }
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #8b5cf6; color: white; border: none; cursor: pointer; }
        button:hover { background: #7c3aed; }
        #result { margin-top: 20px; }
        img { max-width: 100%; border-radius: 8px; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1> Test Worker IA Pixora</h1>
    <p>Worker: <code>ia-pixora-api.slimansoufian1.workers.dev</code></p>
    
    <textarea id="prompt" placeholder="Ton prompt...">Epic fantasy warrior in black armor with glowing blue runes</textarea>
    <br>
    <button onclick="generer()">🎨 Générer l'image</button>
    
    <div id="result"></div>

    <script>
        async function generer() {
            const prompt = document.getElementById('prompt').value;
            const result = document.getElementById('result');
            result.innerHTML = '<p>⏳ Génération en cours...</p>';

            try {
                const response = await fetch('https://ia-pixora-api.slimansoufian1.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        width: 1024,
                        height: 1024
                    })
                });

                const data = await response.json();
                console.log('Réponse:', data);

                if (data.url) {
                    result.innerHTML = `
                        <h3>✅ Succès !</h3>
                        <img src="${data.url}" alt="Generated">
                        <br><br>
                        <a href="${data.url}" download="image.png" style="color: #8b5cf6;"> Télécharger</a>
                    `;
                } else if (data.error) {
                    result.innerHTML = `<p class="error">❌ Erreur: ${data.error}</p>`;
                } else {
                    result.innerHTML = `<p class="error">❌ Réponse inattendue: ${JSON.stringify(data)}</p>`;
                }

            } catch (error) {
                result.innerHTML = `<p class="error">❌ Erreur: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
