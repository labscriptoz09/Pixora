<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Krea API - IA Pixora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f14 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .subtitle { color: #A1A1AA; margin-bottom: 2rem; text-align: center; }
        
        .test-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 16px;
            padding: 2rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600;
            color: #A1A1AA; 
            margin-bottom: 0.5rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;            outline: none;
            transition: all 0.3s;
        }
        input:focus, textarea:focus, select:focus { 
            border-color: #8B5CF6; 
            background: rgba(139, 92, 246, 0.05);
        }
        textarea { min-height: 100px; resize: vertical; }
        
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .result-box {
            margin-top: 2rem;
            min-height: 400px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed rgba(255,255,255,0.1);
            position: relative;
        }
        .result-box img { 
            max-width: 100%; 
            border-radius: 8px;
            display: block;
        }
        .loading { 
            display: none;             text-align: center; 
            color: #8B5CF6;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .loading.active { display: flex; }
        .error-msg { 
            color: #EF4444; 
            padding: 1.5rem; 
            text-align: center;
            font-size: 0.95rem;
        }
        .success-msg {
            color: #10B981;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .info-box {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(139, 92, 246, 0.1);
            border-left: 4px solid #8B5CF6;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .info-box code {
            background: rgba(0,0,0,0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Test Krea API</h1>
        <p class="subtitle">Via Vercel Proxy - RapidAPI</p>
        <div class="test-card">
            <div class="form-group">
                <label>Prompt</label>
                <textarea id="krea-prompt" placeholder="Décris l'image que tu veux générer...">Epic fantasy warrior in black armor with glowing blue runes, cinematic lighting, highly detailed, photorealistic</textarea>
            </div>
            
            <div class="form-group">
                <label>Format</label>
                <select id="krea-format">
                    <option value="1024x1024">Carré (1024×1024)</option>
                    <option value="768x1024">Portrait (768×1024)</option>
                    <option value="1024x768">Paysage (1024×768)</option>
                    <option value="1024x576">Wide (1024×576)</option>
                    <option value="576x1024">Vertical (576×1024)</option>
                </select>
            </div>

            <button onclick="testKrea()" id="btn-krea">
                <span>🎨</span>
                <span>Générer avec Krea</span>
            </button>

            <div class="info-box">
                💡 <strong>Info :</strong> Cette API utilise RapidAPI via ton serveur Vercel. 
                La clé est configurée dans les variables d'environnement Vercel.
            </div>

            <div class="result-box" id="res-krea">
                <div class="loading" id="load-krea">
                    <div class="spinner"></div>
                    <div>
                        <p style="font-weight: 600; font-size: 1.1rem;">Génération en cours...</p>
                        <p style="font-size: 0.85rem; color: #A1A1AA;">Cela peut prendre 10-30 secondes</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testKrea() {
            const prompt = document.getElementById('krea-prompt').value.trim();
            const format = document.getElementById('krea-format').value;
            const btn = document.getElementById('btn-krea');
            const load = document.getElementById('load-krea');
            const resBox = document.getElementById('res-krea');

            if (!prompt) { 
                alert('Entre un prompt pour générer une image'); 
                return;             }

            btn.disabled = true;
            load.classList.add('active');
            resBox.innerHTML = '';
            resBox.appendChild(load);

            const [width, height] = format.split('x').map(Number);
            const startTime = Date.now();

            try {
                const response = await fetch('/api/test-krea', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        width: width,
                        height: height
                    })
                });

                const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(2);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || errorData.message || `Erreur ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Réponse Krea:', data);
                
                load.classList.remove('active');
                
                if (data.url || data.output || data.image) {
                    const imageUrl = data.url || data.output || data.image || (data.images && data.images[0]);
                    
                    if (imageUrl) {
                        // Créer l'élément image
                        const img = document.createElement('img');
                        img.src = imageUrl;
                        img.alt = "Generated by Krea";
                        img.onload = () => {
                            console.log(`✅ Image chargée en ${elapsedTime}s`);
                        };
                        img.onerror = () => {
                            console.error('Erreur chargement image');
                        };
                        
                        // Créer un conteneur avec infos
                        const container = document.createElement('div');                        container.style.textAlign = 'center';
                        
                        container.innerHTML = `
                            <div class="success-msg">
                                ✅ Généré en <strong>${elapsedTime}s</strong><br>
                                <small>Format: ${width}×${height}</small>
                            </div>
                        `;
                        container.appendChild(img);
                        
                        resBox.appendChild(container);
                        
                        // Afficher l'endpoint utilisé si disponible
                        if (data.endpoint) {
                            console.log(`Endpoint utilisé: ${data.endpoint}`);
                        }
                    } else {
                        throw new Error('Aucune URL d\'image dans la réponse');
                    }
                } else {
                    console.log('Données brutes:', data);
                    throw new Error('Format de réponse inattendu. Vérifie la console.');
                }
                
            } catch (error) {
                console.error('❌ Erreur Krea:', error);
                load.classList.remove('active');
                resBox.innerHTML = `
                    <div class="error-msg">
                        <div style="font-size: 2rem; margin-bottom: 1rem;">❌</div>
                        <div style="font-weight: 600; margin-bottom: 0.5rem;">Erreur de génération</div>
                        <div style="font-size: 0.85rem; color: #A1A1AA;">${error.message}</div>
                        <div style="margin-top: 1rem; font-size: 0.8rem;">
                            💡 Vérifie que la clé RAPIDAPI_KEY est configurée dans Vercel
                        </div>
                    </div>
                `;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
