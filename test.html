<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test OVHcloud AI Endpoints - SDXL</title>
<style>
body{margin:0;padding:2rem;background:#050507;color:#fff;font-family:'Inter',sans-serif}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;margin-bottom:.5rem}
.subtitle{text-align:center;color:#A1A1AA;margin-bottom:1.5rem;font-size:.9rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:#FAFAFA}
input[type="text"],textarea{width:100%;padding:.9rem;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;transition:all .3s}
input[type="text"]:focus,textarea:focus{border-color:#0066FF;background:rgba(255,255,255,.1)}
textarea{min-height:100px;resize:vertical}
.btn-gen{width:100%;padding:1rem;background:linear-gradient(135deg,#0066FF,#00A3FF);color:#fff;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,102,255,.4)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed;transform:none}
.result{margin-top:1.5rem;text-align:center}
.result img{max-width:100%;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.status{padding:1rem;border-radius:10px;margin-top:1rem;text-align:center}
.status.loading{background:rgba(0,102,255,.1);color:#00A3FF}
.status.success{background:rgba(16,185,129,.1);color:#10B981}
.status.error{background:rgba(239,68,68,.1);color:#EF4444}
.timer{font-family:'JetBrains Mono',monospace;font-size:.9rem;margin-top:.5rem}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<h1>🧪 Test OVHcloud AI Endpoints</h1>
<p class="subtitle">Stable Diffusion XL — API gratuite et professionnelle</p>

<div class="form-group">
<label for="prompt">Prompt (description de l'image)</label>
<textarea id="prompt" placeholder="Ex: A beautiful portrait of a young woman with curly red hair, golden hour lighting, cinematic atmosphere, masterpiece quality"></textarea>
</div>

<div class="form-group">
<label for="negative">Negative Prompt (ce que tu ne veux pas)</label>
<input type="text" id="negative" placeholder="ugly, blurry, low quality, distorted">
</div>

<button class="btn-gen" id="btn" onclick="generate()">🚀 Générer l'Image</button>

<div id="status"></div>
<div class="result" id="result"></div>
</div>
<script>
// ✅ TA CLÉ API OVHcloud
const API_KEY = 'eyJhbGciOiJFZERTQSIsImtpZCI6IjgzMkFGNUE5ODg3MzFCMDNGM0EzMTRFMDJFRUJFRjBGNDE5MUY0Q0YiLCJraW5kIjoicGF0IiwidHlwIjoiSldUIn0.eyJ0b2tlbiI6Im1QenRqTkxlMlY2SVpyMWRrbkV2R1RXaEhmaXFxNFdnN3FuYnBuRUNVSUE9In0.t6eESdVYmFD3mXwwUUetJJXlhL1BxEWijT4wkK8xbURgYXrcCZsvComY3xaNT_BBNDwptHYgL4wHrIwsEP0QBQ';

async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const negative = document.getElementById('negative').value.trim();
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  if (!prompt) {
    statusEl.innerHTML = '<div class="status error">❌ Entre un prompt !</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Génération en cours...';
  resultEl.innerHTML = '';
  
  const startTime = Date.now();
  statusEl.innerHTML = '<div class="status loading">⏳ Connexion à OVHcloud AI Endpoints...<div class="timer">Temps écoulé: 0.0s</div></div>';
  
  const timerInterval = setInterval(() => {
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    const timerEl = statusEl.querySelector('.timer');
    if (timerEl) timerEl.textContent = `Temps écoulé: ${elapsed}s`;
  }, 100);

  try {
    // Appel API OVHcloud AI Endpoints
    const response = await fetch('https://api.ovh.com/ai-endpoints/stable-diffusion-xl/generate', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        prompt: prompt,
        negative_prompt: negative || 'ugly, blurry, low quality, distorted, watermark',
        width: 1024,
        height: 1024,
        num_inference_steps: 30,
        guidance_scale: 7.5,
        seed: Math.floor(Math.random() * 999999)
      })
    });

    clearInterval(timerInterval);
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(`HTTP ${response.status}: ${errorData.message || response.statusText}`);
    }

    const data = await response.json();
    
    if (!data.images || !data.images[0]) {
      throw new Error('Aucune image générée');
    }

    const imageUrl = data.images[0].url || data.images[0];
    
    statusEl.innerHTML = `<div class="status success">✅ Image générée en ${elapsed}s !</div>`;
    
    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = 'Generated by SDXL';
    img.onclick = () => window.open(imageUrl, '_blank');
    img.style.cursor = 'pointer';
    
    const info = document.createElement('p');
    info.style.cssText = 'color:#A1A1AA;margin-top:1rem;font-size:.85rem';
    info.innerHTML = `📐 1024×1024 | ️ ${elapsed}s | 🎲 Seed: ${data.seed || 'N/A'}`;
    
    resultEl.appendChild(img);
    resultEl.appendChild(info);

  } catch (error) {
    clearInterval(timerInterval);
    console.error('OVH API Error:', error);
    statusEl.innerHTML = `<div class="status error">❌ Erreur: ${error.message}</div>`;
  }

  btn.disabled = false;
  btn.textContent = '🚀 Générer l\'Image';
}
</script>
</body>
</html>
