<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Debug Rapide</title>
<style>
body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
.test { margin: 15px 0; padding: 15px; border-left: 5px solid #666; background: #111; }
.ok { border-color: #0f0; background: #001100; }
.fail { border-color: #f00; background: #110000; }
.warn { border-color: #ff0; background: #111100; }
h1 { color: #8B5CF6; text-align: center; }
pre { background: #222; padding: 10px; overflow: auto; font-size: 12px; }
button { background: #8B5CF6; color: #fff; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>
<h1> Debug IA Pixora</h1>
<div id="results"></div>
<button onclick="testEdge()">Tester Edge Function</button>
<button onclick="testVercel()">Tester Vercel</button>
<button onclick="testDB()">Tester DB</button>

<script>
const SUPABASE_URL = 'https://cfwzilhetkclpytjsopu.supabase.co';
const EDGE_URL = 'https://cfwzilhetkclpytjsopu.supabase.co/functions/v1/generate-image';
const VERCEL_URL = 'https://iapixora.com/api/generate';

function addTest(title, status, data) {
    const div = document.createElement('div');
    div.className = 'test ' + status;
    div.innerHTML = `<strong>${title}</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
    document.getElementById('results').appendChild(div);
}

async function testEdge() {
    addTest('Edge Function (sans token)', 'warn', 'Test en cours...');
    try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 5000);
        
        const res = await fetch(EDGE_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({prompt: 'test', width: 512, height: 512}),
            signal: ctrl.signal
        });
        const text = await res.text();
        addTest('Edge Function', res.ok ? 'ok' : 'fail', {
            status: res.status,
            response: text.substring(0, 200)
        });
    } catch(e) {
        addTest('Edge Function', 'fail', {error: e.message});
    }
}

async function testVercel() {
    addTest('Vercel API', 'warn', 'Test en cours...');
    try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 5000);
        
        const res = await fetch(VERCEL_URL, {signal: ctrl.signal});
        const text = await res.text();
        addTest('Vercel API', 'ok', {
            status: res.status,
            response: text.substring(0, 200)
        });
    } catch(e) {
        addTest('Vercel API', 'fail', {error: e.message});
    }
}

async function testDB() {
    addTest('Base de données', 'warn', 'Test en cours...');
    try {
        const supabase = window.supabase.createClient(SUPABASE_URL, 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmd3ppbGhldGtjbHB5dGpzb3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDYxNjgsImV4cCI6MjA5ODkyMjE2OH0.fUAiUlEureXCj2bXJefuVvNoo9ktjDeyKb4VOK7GrEU');
        
        const {data, error} = await supabase.from('pixora_creations').select('id').limit(1);
        if (error) throw error;
        addTest('Base de données', 'ok', {count: data ? data.length : 0});
    } catch(e) {
        addTest('Base de données', 'fail', {error: e.message});
    }
}

// Lancer au chargement
window.onload = () => {
    addTest('Page chargée', 'ok', 'Clique sur les boutons pour tester');
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
