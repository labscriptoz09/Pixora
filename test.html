<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test R2 - Diagnostic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:monospace;padding:15px;font-size:13px;line-height:1.6}
h1{color:#8B5CF6;margin-bottom:15px;font-size:1.2rem;text-align:center}
.test{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px;margin-bottom:12px}
.test-title{font-weight:700;color:#A1A1AA;margin-bottom:8px;font-size:0.8rem;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;font-family:monospace;font-size:0.85rem}
.result{margin-top:8px;padding:8px;background:rgba(0,0,0,0.4);border-radius:6px;word-break:break-all;min-height:30px;font-size:0.75rem}
.ok{color:#10B981}.ko{color:#EF4444}.info{color:#3B82F6}
.img-box{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.img-row{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
.img-row img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:2px solid rgba(255,255,255,0.1);flex-shrink:0}
.img-row .img-info{flex:1;font-size:0.7rem;word-break:break-all}
.img-row.loaded img{border-color:#10B981}
.img-row.failed img{border-color:#EF4444;opacity:0.3}
.log{background:#000;color:#0f0;padding:10px;border-radius:8px;max-height:200px;overflow-y:auto;margin-top:10px;font-size:0.7rem}
.log div{margin-bottom:3px}
.le{color:#f00}.ls{color:#0f0}.li{color:#0af}
.headers-box{background:rgba(0,0,0,0.5);padding:8px;border-radius:6px;font-size:0.65rem;margin-top:5px;white-space:pre-wrap;color:#A1A1AA}
</style>
</head>
<body>

<h1>🔍 Test R2 - Diagnostic Complet</h1>

<!-- TEST 1: CORS Headers -->
<div class="test">
  <div class="test-title">1️⃣ Vérification Headers CORS</div>
  <button class="btn" onclick="testCORS()">Tester les headers CORS</button>
  <div class="result" id="r-cors">En attente...</div>
  <div class="headers-box" id="cors-headers"></div>
</div>

<!-- TEST 2: Chargement images avec crossorigin -->
<div class="test">
  <div class="test-title">2️⃣ Images AVEC crossorigin="anonymous"</div>
  <button class="btn" onclick="testWithCrossOrigin()">Tester avec crossorigin</button>
  <div class="result" id="r-cross">En attente...</div>
  <div class="img-box" id="imgs-cross"></div>
</div>

<!-- TEST 3: Chargement images SANS crossorigin -->
<div class="test">
  <div class="test-title">3️⃣ Images SANS crossorigin</div>  <button class="btn" onclick="testWithoutCrossOrigin()">Tester sans crossorigin</button>
  <div class="result" id="r-nocross">En attente...</div>
  <div class="img-box" id="imgs-nocross"></div>
</div>

<!-- TEST 4: Fetch direct -->
<div class="test">
  <div class="test-title">4️⃣ Fetch Direct (mode no-cors vs cors)</div>
  <button class="btn" onclick="testFetch()">Tester fetch</button>
  <div class="result" id="r-fetch">En attente...</div>
</div>

<!-- LOGS -->
<div class="test">
  <div class="test-title">📋 Logs</div>
  <div class="log" id="logs"></div>
</div>

<script>
var R2_URL = 'https://pub-5df218abc5c34ffe8e2a67276fce23d1.r2.dev';
var TEST_IMAGES = [
  'img_1785955454840_cmmc05.jpg',
  'img_1785956280462_5qyoqy.jpg',
  'img_1785956508155_d7qx02.jpg',
  'img_1785958502971_qg8f08.jpg'
];

function log(msg, type) {
  type = type || 'li';
  var el = document.getElementById('logs');
  var d = document.createElement('div');
  d.className = type;
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

// TEST 1: CORS Headers
async function testCORS() {
  var r = document.getElementById('r-cors');
  var h = document.getElementById('cors-headers');
  r.textContent = 'Vérification...';
  r.className = 'result info';
  h.textContent = '';

  try {
    var resp = await fetch(R2_URL + '/' + TEST_IMAGES[0], { method: 'HEAD' });
    var headers = {};
    resp.headers.forEach(function(val, key) {
      headers[key] = val;    });

    var corsOK = headers['access-control-allow-origin'];
    var methods = headers['access-control-allow-methods'];

    var txt = 'Status: ' + resp.status + '\n';
    txt += 'CORS Origin: ' + (corsOK || '❌ ABSENT') + '\n';
    txt += 'CORS Methods: ' + (methods || '❌ ABSENT') + '\n';
    txt += 'Content-Type: ' + (headers['content-type'] || '❌ ABSENT');

    h.textContent = JSON.stringify(headers, null, 2);

    if (corsOK === '*' || corsOK === 'https://iapixora.com') {
      r.textContent = '✅ CORS configuré correctement!\n' + txt;
      r.className = 'result ok';
      log('CORS OK: ' + corsOK, 'ls');
    } else if (!corsOK) {
      r.textContent = '❌ CORS MANQUANT! Les images ne s\'afficheront pas avec crossorigin.\n' + txt;
      r.className = 'result ko';
      log('CORS MANQUANT!', 'le');
    } else {
      r.textContent = '⚠️ CORS présent mais limité: ' + corsOK + '\n' + txt;
      r.className = 'result info';
      log('CORS limité: ' + corsOK, 'li');
    }
  } catch(e) {
    r.textContent = '❌ Erreur fetch: ' + e.message;
    r.className = 'result ko';
    log('CORS fetch error: ' + e.message, 'le');
  }
}

// TEST 2: Avec crossorigin
function testWithCrossOrigin() {
  var r = document.getElementById('r-cross');
  var box = document.getElementById('imgs-cross');
  r.textContent = 'Chargement...';
  r.className = 'result info';
  box.innerHTML = '';

  var loaded = 0, failed = 0;

  TEST_IMAGES.forEach(function(fileName) {
    var row = document.createElement('div');
    row.className = 'img-row';
    row.innerHTML = '<img src="' + R2_URL + '/' + fileName + '" crossorigin="anonymous" alt="' + fileName + '">' +
      '<div class="img-info">' + fileName + '<br><span class="status">⏳ Chargement...</span></div>';
    box.appendChild(row);

    var img = row.querySelector('img');    var status = row.querySelector('.status');

    img.onload = function() {
      loaded++;
      row.classList.add('loaded');
      status.textContent = '✅ Affiché';
      status.style.color = '#10B981';
      checkDone();
    };
    img.onerror = function() {
      failed++;
      row.classList.add('failed');
      status.textContent = '❌ BLOQUÉ (CORS?)';
      status.style.color = '#EF4444';
      log('crossorigin BLOQUÉ: ' + fileName, 'le');
      checkDone();
    };
  });

  function checkDone() {
    if (loaded + failed === TEST_IMAGES.length) {
      r.textContent = 'Résultat: ' + loaded + ' OK / ' + failed + ' BLOQUÉS';
      r.className = failed === 0 ? 'result ok' : 'result ko';
      log('crossorigin: ' + loaded + ' OK, ' + failed + ' bloqués', failed === 0 ? 'ls' : 'le');
    }
  }
}

// TEST 3: Sans crossorigin
function testWithoutCrossOrigin() {
  var r = document.getElementById('r-nocross');
  var box = document.getElementById('imgs-nocross');
  r.textContent = 'Chargement...';
  r.className = 'result info';
  box.innerHTML = '';

  var loaded = 0, failed = 0;

  TEST_IMAGES.forEach(function(fileName) {
    var row = document.createElement('div');
    row.className = 'img-row';
    row.innerHTML = '<img src="' + R2_URL + '/' + fileName + '" alt="' + fileName + '">' +
      '<div class="img-info">' + fileName + '<br><span class="status">⏳ Chargement...</span></div>';
    box.appendChild(row);

    var img = row.querySelector('img');
    var status = row.querySelector('.status');

    img.onload = function() {
      loaded++;      row.classList.add('loaded');
      status.textContent = '✅ Affiché';
      status.style.color = '#10B981';
      checkDone();
    };
    img.onerror = function() {
      failed++;
      row.classList.add('failed');
      status.textContent = '❌ Échoué';
      status.style.color = '#EF4444';
      log('sans crossorigin ÉCHOUÉ: ' + fileName, 'le');
      checkDone();
    };
  });

  function checkDone() {
    if (loaded + failed === TEST_IMAGES.length) {
      r.textContent = 'Résultat: ' + loaded + ' OK / ' + failed + ' échoués';
      r.className = failed === 0 ? 'result ok' : 'result ko';
      log('sans crossorigin: ' + loaded + ' OK, ' + failed + ' échoués', failed === 0 ? 'ls' : 'le');
    }
  }
}

// TEST 4: Fetch modes
async function testFetch() {
  var r = document.getElementById('r-fetch');
  r.textContent = 'Test fetch...';
  r.className = 'result info';

  var url = R2_URL + '/' + TEST_IMAGES[0];
  var results = [];

  // Mode cors
  try {
    var resp1 = await fetch(url, { mode: 'cors' });
    results.push('mode=cors → Status: ' + resp1.status + ' ✅');
    log('fetch cors: ' + resp1.status, 'ls');
  } catch(e) {
    results.push('mode=cors → ❌ ' + e.message);
    log('fetch cors error: ' + e.message, 'le');
  }

  // Mode no-cors
  try {
    var resp2 = await fetch(url, { mode: 'no-cors' });
    results.push('mode=no-cors → Type: ' + resp2.type + ' Status: ' + resp2.status);
    log('fetch no-cors: type=' + resp2.type, 'li');
  } catch(e) {
    results.push('mode=no-cors → ❌ ' + e.message);    log('fetch no-cors error: ' + e.message, 'le');
  }

  r.textContent = results.join('\n');
  r.className = results[0].indexOf('✅') !== -1 ? 'result ok' : 'result ko';
}

window.onload = function() {
  log('Page test R2 chargée', 'li');
  log('R2 URL: ' + R2_URL, 'li');
  log('Images à tester: ' + TEST_IMAGES.length, 'li');
};
</script>
</body>
</html>
