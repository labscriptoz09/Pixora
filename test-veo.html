<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Veo 3.1 — IA Pixora</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050507;color:#FAFAFA;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
        h1{font-size:1.5rem;margin-bottom:0.5rem;background:linear-gradient(135deg,#fff 20%,#8B5CF6 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        p.sub{color:#A1A1AA;font-size:0.85rem;margin-bottom:2rem;text-align:center}
        .card{background:rgba(24,24,27,0.6);border:1px solid rgba(63,63,70,0.5);border-radius:16px;padding:1.5rem;width:100%;max-width:500px}
        label{display:block;font-size:0.75rem;font-weight:600;color:#A1A1AA;margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.08em}
        input,textarea{width:100%;padding:0.8rem;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:1rem}
        input:focus,textarea:focus{border-color:#8B5CF6}
        button{width:100%;padding:0.9rem;background:linear-gradient(135deg,#8B5CF6,#EC4899);color:white;border:none;border-radius:10px;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.3s}
        button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(139,92,246,0.5)}
        button:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .status{margin-top:1rem;padding:0.8rem;border-radius:10px;font-size:0.85rem;font-weight:600;display:none}
        .status.info{display:block;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);color:#8B5CF6}
        .status.success{display:block;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10B981}
        .status.error{display:block;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#EF4444}
        video{width:100%;border-radius:12px;margin-top:1rem;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .warn{margin-top:1.5rem;font-size:0.7rem;color:#71717A;text-align:center}
    </style>
</head>
<body>
    <h1>🎬 Test Veo 3.1</h1>
    <p class="sub">Page de test isolée — Aucune modification du site principal</p>

    <div class="card">
        <label>Clé API Google AI Studio</label>
        <input type="password" id="api-key" placeholder="AIzaSy...">

        <label>Prompt</label>
        <textarea id="prompt" placeholder="A cat walking on a rainbow bridge, cinematic lighting, 720p">A cat walking on a rainbow bridge, cinematic lighting, 720p, 8 seconds</textarea>

        <button id="btn-gen" onclick="generateVideo()">Générer la vidéo</button>

        <div class="status" id="status"></div>
        <video id="result-video" controls playsinline></video>
    </div>

    <p class="warn">⚠️ Ta clé API reste dans ton navigateur uniquement.<br>Elle n'est envoyée qu'à Google. Aucun stockage serveur.</p>

    <script>
    async function generateVideo() {
        var key = document.getElementById('api-key').value.trim();
        var prompt = document.getElementById('prompt').value.trim();
        var btn = document.getElementById('btn-gen');        var status = document.getElementById('status');
        var video = document.getElementById('result-video');

        if (!key || !prompt) {
            showStatus('error', '❌ Remplis la clé API et le prompt.');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Génération en cours...';
        video.style.display = 'none';
        showStatus('info', '🔄 Envoi de la requête à Veo 3.1...');

        try {
            // Étape 1: Lancer la génération asynchrone
            var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/veo-3.1-generate-preview:predictLongRunning?key=' + key, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    instances: [{ prompt: prompt }],
                    parameters: {
                        durationSeconds: 8,
                        personGeneration: 'allow_all'
                    }
                })
            });

            if (!res.ok) {
                var err = await res.json();
                throw new Error(err.error?.message || 'Erreur HTTP ' + res.status);
            }

            var opData = await res.json();
            var opName = opData.name;

            if (!opName) {
                throw new Error('Aucune opération retournée. Vérifie ta clé et le modèle.');
            }

            showStatus('info', '⏳ Génération lancée. Polling en cours... (' + opName + ')');

            // Étape 2: Polling jusqu'à complétion
            var maxAttempts = 60;
            var attempt = 0;
            var done = false;
            var videoUrl = null;

            while (!done && attempt < maxAttempts) {
                await new Promise(r => setTimeout(r, 3000));
                attempt++;
                var pollRes = await fetch('https://generativelanguage.googleapis.com/v1beta/' + opName + '?key=' + key);
                var pollData = await pollRes.json();

                showStatus('info', '⏳ Polling... tentative ' + attempt + '/' + maxAttempts);

                if (pollData.done) {
                    if (pollData.error) {
                        throw new Error(pollData.error.message || 'Erreur lors de la génération');
                    }
                    videoUrl = pollData.response?.videoUri || pollData.response?.generatedVideos?.[0]?.uri;
                    done = true;
                }
            }

            if (!done) {
                throw new Error('Timeout après ' + maxAttempts + ' tentatives. Réessaie.');
            }

            if (!videoUrl) {
                throw new Error('Vidéo générée mais aucune URL trouvée.');
            }

            // Étape 3: Afficher la vidéo
            video.src = videoUrl;
            video.style.display = 'block';
            video.play();
            showStatus('success', '✅ Vidéo générée avec succès !');
            btn.textContent = '🎬 Générer une autre vidéo';

        } catch (e) {
            showStatus('error', '❌ ' + e.message);
            btn.textContent = 'Réessayer';
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(type, msg) {
        var el = document.getElementById('status');
        el.className = 'status ' + type;
        el.textContent = msg;
    }
    </script>
</body>
</html>
